{% extends "base.html" %}
{% block title %}Sign in · CodexSIEM{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">CS</div>
      <div>
        <h1>Welcome back</h1>
        <p class="subtitle">CodexSIEM · Microsoft 365</p>
      </div>
    </div>
    <p class="lead">Sign in with your assigned role account (admin, manager, or user).</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" placeholder="Username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
