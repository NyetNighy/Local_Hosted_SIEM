<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}CodexSIEM{% endblock %}</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: #0f1628;
      --panel-soft: #151e33;
      --panel-hover: #1a2540;
      --text: #eef3ff;
      --muted: #8fa0c2;
      --line: #223049;
      --accent: #5b8cff;
      --accent-hover: #6f9bff;
      --accent-soft: rgba(91, 140, 255, 0.14);
      --success: #22d3a6;
      --success-soft: rgba(34, 211, 166, 0.14);
      --danger: #ff6b81;
      --danger-soft: rgba(255, 107, 129, 0.14);
      --warn: #ffb020;
      --warn-soft: rgba(255, 176, 32, 0.14);
      --sidebar-w: 220px;
      --radius: 12px;
      --radius-sm: 8px;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.4;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background: linear-gradient(180deg, #0c1324 0%, #0a101c 100%);
      border-right: 1px solid var(--line);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 8px 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: grid; place-items: center; font-weight: 800; color: white;
      font-size: 12px; flex-shrink: 0;
    }
    .sidebar-brand h1 {
      margin: 0; font-size: 0.95rem; letter-spacing: -0.02em;
    }
    .sidebar-brand .tag {
      margin: 1px 0 0; color: var(--muted); font-size: 0.7rem;
    }
    .nav-section {
      font-size: 0.65rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 12px 10px 4px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      color: var(--muted); font-size: 0.85rem; font-weight: 600;
      transition: background .12s ease, color .12s ease;
    }
    .nav-link:hover { background: var(--panel-hover); color: var(--text); }
    .nav-link.active {
      background: var(--accent-soft); color: var(--accent);
    }
    .nav-link .ico {
      width: 18px; text-align: center; font-size: 0.85rem; opacity: 0.85;
    }
    .sidebar-foot {
      margin-top: auto; padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .user-chip {
      padding: 8px 10px; border-radius: 8px;
      background: var(--panel-soft); margin-bottom: 8px;
    }
    .user-chip .name { font-size: 0.8rem; font-weight: 700; }
    .user-chip .role {
      font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .main {
      min-width: 0;
      padding: 18px 20px 32px;
      background:
        radial-gradient(900px 400px at 100% -10%, rgba(91, 140, 255, 0.08), transparent 50%),
        var(--bg);
    }
    .page-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .page-head h2 {
      margin: 0; font-size: 1.15rem; letter-spacing: -0.02em;
    }
    .page-head .subtitle {
      margin: 2px 0 0; color: var(--muted); font-size: 0.8rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: 1px solid transparent; background: var(--panel-soft);
      color: var(--text); padding: 0.4rem 0.75rem; border-radius: 999px;
      cursor: pointer; font-weight: 600; font-size: 0.8rem;
      transition: background .12s ease, border-color .12s ease;
      text-decoration: none; white-space: nowrap;
    }
    .btn:hover { background: var(--panel-hover); color: var(--text); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.success { background: var(--success); color: #04261d; }
    .btn.ghost { border-color: var(--line); background: transparent; }
    .btn.ghost:hover { background: var(--panel-soft); }
    .btn.block { width: 100%; border-radius: var(--radius-sm); }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px; margin-bottom: 12px;
    }
    @media (max-width: 900px) {
      .card-grid { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 12px 14px;
    }
    .stat-card .label {
      color: var(--muted); font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stat-card .value {
      margin-top: 4px; font-size: 1.45rem; font-weight: 700;
      letter-spacing: -0.03em;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }
    .panel-title {
      margin: 0 0 10px; font-size: 0.85rem; font-weight: 700;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search-form { display: flex; gap: 6px; flex: 1; min-width: 200px; }

    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 0.5rem 0.7rem;
      border-radius: var(--radius-sm); border: 1px solid var(--line);
      background: #0a101c; color: var(--text); font-size: 0.85rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    input::placeholder { color: #667aa0; }
    label {
      display: block; font-size: 0.72rem; color: var(--muted);
      margin-bottom: 4px; font-weight: 600;
    }
    .field { display: flex; flex-direction: column; }
    .hint { color: var(--muted); font-size: 0.7rem; margin-top: 3px; }
    .form-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .form-grid .full { grid-column: 1 / -1; }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    thead { background: var(--panel-soft); position: sticky; top: 0; z-index: 1; }
    th {
      padding: 7px 10px; border-bottom: 1px solid var(--line);
      font-size: 0.68rem; text-align: left; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
      white-space: nowrap;
    }
    td {
      padding: 6px 10px; border-bottom: 1px solid rgba(34, 48, 73, 0.85);
      font-size: 0.78rem; vertical-align: middle;
    }
    tbody tr:hover { background: rgba(26, 37, 64, 0.55); }
    tbody tr:last-child td { border-bottom: none; }
    .empty {
      color: var(--muted); text-align: center;
      padding: 20px 10px !important; font-size: 0.85rem;
    }

    .badge {
      display: inline-flex; align-items: center; padding: 0.12rem 0.45rem;
      border-radius: 999px; font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .badge-high, .sev-high { background: var(--danger-soft); color: var(--danger); }
    .badge-medium, .sev-medium { background: var(--warn-soft); color: var(--warn); }
    .badge-low, .sev-low { background: var(--success-soft); color: var(--success); }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-error, .badge-failed, .badge-denied { background: var(--danger-soft); color: var(--danger); }
    .badge-partial { background: var(--warn-soft); color: var(--warn); }

    .alert {
      border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 10px;
      font-size: 0.82rem; border: 1px solid transparent;
    }
    .alert-error { background: var(--danger-soft); border-color: rgba(255,107,129,0.3); color: #ffd0d8; }
    .alert-info { background: var(--accent-soft); border-color: rgba(91,140,255,0.3); color: #d6e4ff; }
    .alert-success { background: var(--success-soft); border-color: rgba(34,211,166,0.3); color: #c9f7ea; }

    .info-box {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px;
      color: var(--muted); font-size: 0.8rem;
    }
    .info-box strong { color: var(--text); }
    .info-box ul { margin: 6px 0 0; padding-left: 16px; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem; color: var(--muted);
      background: #0a101c; padding: 1px 5px; border-radius: 4px;
    }
    td code {
      display: inline-block; max-width: 200px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--line); background: var(--panel-soft);
      color: var(--text); border-radius: 8px; padding: 6px 10px;
      font-weight: 700; cursor: pointer; font-size: 0.8rem;
      margin-bottom: 8px;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; left: 0; top: 0; z-index: 40;
        width: min(260px, 86vw); transform: translateX(-105%);
        transition: transform .2s ease; box-shadow: 8px 0 24px rgba(0,0,0,.4);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: inline-flex; }
      .sidebar-backdrop {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30;
      }
      .sidebar-backdrop.show { display: block; }
    }

    .auth-page {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background:
        radial-gradient(900px 500px at 20% -10%, rgba(91, 140, 255, 0.15), transparent 55%),
        var(--bg);
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 24px 22px;
    }
    .auth-card h1 { margin: 0 0 4px; font-size: 1.25rem; letter-spacing: -0.02em; }
    .auth-card p.lead { margin: 0 0 16px; color: var(--muted); font-size: 0.85rem; }
    .auth-card form { display: grid; gap: 10px; }
    .auth-card .btn { width: 100%; border-radius: var(--radius-sm); padding: 0.65rem; }
    .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script>
    function toggleSidebar() {
      var s = document.getElementById('sidebar');
      var b = document.getElementById('sidebar-backdrop');
      if (!s) return;
      s.classList.toggle('open');
      if (b) b.classList.toggle('show');
    }
  </script>
</body>
</html>
