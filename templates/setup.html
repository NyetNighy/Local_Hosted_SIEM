{% extends "base.html" %}
{% block title %}Initial setup · CodexSIEM{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">CS</div>
      <div>
        <h1>First-run setup</h1>
        <p class="subtitle">Create the initial Admin account</p>
      </div>
    </div>
    <p class="lead">This account will have full control over tenants, users, and audit logs.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
      <div class="field">
        <label>Username</label>
        <input value="Admin" disabled />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Choose a strong password" required />
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required />
      </div>
      <button class="btn primary" type="submit">Create Admin account</button>
    </form>
  </div>
</div>
{% endblock %}
